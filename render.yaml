# Render Blueprint: crea la base Postgres y el servicio web desde el Dockerfile.
# En Render: New → Blueprint → elige este repositorio. Te pedirá los valores marcados sync: false.
databases:
  - name: blinka-db
    plan: free

services:
  - type: web
    name: blinka
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blinka-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
