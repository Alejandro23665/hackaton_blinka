# Render Blueprint: crea la base Postgres y el servicio web desde el Dockerfile.
# En Render: New → Blueprint → elige este repositorio. Te pedirá los valores marcados sync: false.
databases:
  - name: blinka-db
    plan: free

services:
  - type: web
    name: blinka
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blinka-db
          property: connectionString
      - key: CLAUDE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AI_MODEL
        value: claude-haiku-5-5
